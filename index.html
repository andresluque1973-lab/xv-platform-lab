<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c4848a" />
 
    <!-- ── SEO básico ── -->
    <title>VELA — Invitaciones digitales</title>
    <meta name="description" content="Invitaciones digitales para tu evento especial." />
 
    <!-- ── Open Graph (WhatsApp, Facebook, Telegram) ── -->
    <!-- Hotfix A2 (FASE 32): metadata heredada de un cliente específico (Sofía)
         neutralizada a genérico de marca VELA. og:url omitido por no tener
         confirmado el dominio oficial de producción. og:image/twitter:image
         omitidos porque public/preview.jpg contiene identidad de Sofía
         incrustada en los píxeles (no reemplazado en este hotfix — ver A2.2).
         og:image:width/height y twitter:card omitidos junto con la imagen
         para no dejar referencias inconsistentes sin un og:image real. -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="VELA — Invitaciones digitales" />
    <meta property="og:description" content="Invitaciones digitales para tu evento especial." />
    <meta property="og:locale"      content="es_AR" />
    <meta property="og:site_name"   content="VELA" />
 
    <!-- ── Twitter Card (también lo usa WhatsApp como fallback) ── -->
    <meta name="twitter:title"       content="VELA — Invitaciones digitales" />
    <meta name="twitter:description" content="Invitaciones digitales para tu evento especial." />
 
    <!-- ── Favicon emoji 🌸 ── -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
